<section id="top" class="hero" aria-labelledby="hero-title">
  <div class="container hero-layout">
    <div class="hero-content">
      <p class="availability">
        <span class="availability-dot" aria-hidden="true"></span>Disponible · Madrid
      </p>
      <h1 id="hero-title">Hola, soy Oscar.<br /><span>Frontend Developer.</span></h1>
      <p class="hero-description">
        Construyo aplicaciones web modernas, escalables y orientadas a producto con Angular, React y
        TypeScript.
      </p>
      <div class="hero-actions">
        <a appButton [routerLink]="['/']" fragment="contact"
          >Hablemos <span aria-hidden="true">→</span></a
        >
        <a appButton variant="secondary" [href]="cvUrl" download="CV_Oscar_Hinjos.pdf"
          >Descargar CV <span aria-hidden="true">↓</span></a
        >
        <a
          appButton
          variant="secondary"
          [href]="profile.github"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        >
        <a
          appButton
          variant="secondary"
          [href]="profile.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn ↗</a
        >
      </div>
      <ul class="hero-technologies" aria-label="Stack principal">
        @for (technology of technologies; track technology) {
          <li><app-tech-chip [label]="technology" /></li>
        }
      </ul>
    </div>
    <div class="portrait">
      <div class="orbit" aria-hidden="true"></div>
      <img
        class="portrait-photo"
        src="/assets/oscar-hinjos.png"
        alt="Oscar Hinjos López"
        width="1122"
        height="1402"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
