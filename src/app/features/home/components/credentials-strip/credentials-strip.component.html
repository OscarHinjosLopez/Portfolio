<section class="credentials" aria-label="Credenciales profesionales">
  <div class="container">
    <dl class="credentials-list">
      @for (credential of credentials; track credential.value) {
        <div class="credential">
          <dt>{{ credential.description }}</dt>
          <dd>{{ credential.value }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
